name: orderlli_pos
description: "Orderlli – A production-ready tablet-first restaurant POS system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Responsive design
  flutter_screenutil: ^5.9.3

  # Typography
  google_fonts: ^6.2.1

  # Spacing utility
  gap: ^3.0.1

  # SVG rendering
  flutter_svg: ^2.0.17

  # Internationalisation & Indian number formatting
  intl: ^0.19.0

  # Local persistence
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/mock/
